[project]
name = "uk-electricity-demand-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.6.4",
    "dagster-dg-cli>=1.11.1",
    "dagster-duckdb>=0.22.0,<1.0.0",
    "dagster-duckdb-polars>=0.22.0,<1.0.0",
    "dagster-polars>=0.22.0,<1.0.0",
    "dagster-webserver>=1.6.4",
    "duckdb>=1.5.1",
    "holidays>=0.93",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "ipython>=9.10.1",
    "ipywidgets>=8.1.8",
    "joblib>=1.5.3",
    "jupyterlab>=4.2.0,<5.0.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "mkdocs>=1.6.1",
    "numpy==2.4.0",
    "pandas>=3.0.1",
    "pip>=26.0.1",
    "plotly-resampler>=0.11.0",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "streamlit>=1.19.0",
    "xgboost>=3.2.0",
]

dev = [
    "ruff>=0.4.0,<1.0.0",
    "pytest>=8.2.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pre-commit>=3.7.0,<4.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_electricity_demand_forecasting"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]



[tool.pytest.ini_options]
testpaths = ["tests"]
