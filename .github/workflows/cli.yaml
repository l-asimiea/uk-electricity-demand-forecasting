name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (dev)
        run: uv sync --frozen

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest tests/ -v --cov=src --cov-report=term-missing

  dagster-check:
    name: Dagster definition check
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check Dagster definitions load
        env:
          DAGSTER_HOME: ${{ github.workspace }}/dagster_home
        run: |
          uv run python -c "
          from uk_demand.definitions import defs
          defs.get_all_asset_keys()
          print('Dagster definitions loaded successfully')
          "

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, dagster-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false          # set to true + add registry credentials to push
          tags: uk-demand:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
